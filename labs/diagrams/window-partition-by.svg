<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <style>
  .title { font: 700 18px Segoe UI, Arial, sans-serif; fill: #1f2937; }
  .label { font: 600 13px Segoe UI, Arial, sans-serif; fill: #111827; }
  .small { font: 12px Segoe UI, Arial, sans-serif; fill: #374151; }
  .muted { font: 11px Segoe UI, Arial, sans-serif; fill: #6b7280; }
  .box { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; }
  .box-hi { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.8; }
  .box-ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.8; }
  .box-warn { fill: #fef3c7; stroke: #d97706; stroke-width: 1.8; }
  .arrow { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
</style>

  <text x="24" y="32" class="title">PARTITION BY = restart the calculation per group</text>
  <text x="24" y="54" class="muted">RANK() OVER (PARTITION BY category ORDER BY price DESC)</text>

  <!-- Cat A -->
  <rect x="24" y="80" width="340" height="220" class="box-hi" rx="8"/>
  <text x="40" y="108" class="label">Partition: Accessories</text>
  <rect x="40" y="128" width="300" height="30" class="box-ok" rx="4"/>
  <text x="52" y="148" class="small">Lock A | 100 | RANK 1</text>
  <rect x="40" y="168" width="300" height="30" class="box" rx="4"/>
  <text x="52" y="188" class="small">Lock B | 90  | RANK 2</text>
  <rect x="40" y="208" width="300" height="30" class="box" rx="4"/>
  <text x="52" y="228" class="small">Lock C | 80  | RANK 3</text>
  <text x="40" y="270" class="muted">Ranks restart inside this box</text>

  <!-- Cat B -->
  <rect x="396" y="80" width="340" height="220" class="box-warn" rx="8"/>
  <text x="412" y="108" class="label">Partition: Beverages</text>
  <rect x="412" y="128" width="300" height="30" class="box-ok" rx="4"/>
  <text x="424" y="148" class="small">Tea   | 50 | RANK 1</text>
  <rect x="412" y="168" width="300" height="30" class="box" rx="4"/>
  <text x="424" y="188" class="small">Coffee| 40 | RANK 2</text>
  <rect x="412" y="208" width="300" height="30" class="box" rx="4"/>
  <text x="424" y="228" class="small">Juice | 30 | RANK 3</text>
  <text x="412" y="270" class="muted">New partition -> RANK starts at 1 again</text>

</svg>
