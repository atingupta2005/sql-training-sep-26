<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <style>
  .title { font: 700 18px Segoe UI, Arial, sans-serif; fill: #1f2937; }
  .label { font: 600 13px Segoe UI, Arial, sans-serif; fill: #111827; }
  .small { font: 12px Segoe UI, Arial, sans-serif; fill: #374151; }
  .muted { font: 11px Segoe UI, Arial, sans-serif; fill: #6b7280; }
  .box { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; }
  .box-hi { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.8; }
  .box-ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.8; }
  .box-warn { fill: #fef3c7; stroke: #d97706; stroke-width: 1.8; }
  .arrow { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
</style>

  <text x="24" y="32" class="title">Running total = growing window over ordered rows</text>
  <text x="24" y="54" class="muted">SUM(freight) OVER (ORDER BY order_date, order_id)</text>

  <!-- Row markers -->
  <text x="40" y="100" class="label">Rows in order</text>
  <rect x="40" y="120" width="120" height="50" class="box" rx="6"/>
  <text x="58" y="142" class="small">Day 1</text>
  <text x="58" y="160" class="small">freight 32</text>

  <rect x="190" y="120" width="120" height="50" class="box" rx="6"/>
  <text x="208" y="142" class="small">Day 2</text>
  <text x="208" y="160" class="small">freight 11</text>

  <rect x="340" y="120" width="120" height="50" class="box" rx="6"/>
  <text x="358" y="142" class="small">Day 3</text>
  <text x="358" y="160" class="small">freight 65</text>

  <!-- Brackets for windows -->
  <path d="M40,190 H160" class="arrow"/>
  <text x="55" y="214" class="small">at Day1: sum=32</text>

  <path d="M40,230 H310" class="arrow"/>
  <text x="90" y="254" class="small">at Day2: sum=32+11=43</text>

  <path d="M40,270 H460" class="arrow"/>
  <text x="120" y="294" class="small">at Day3: sum=32+11+65=108</text>

  <text x="500" y="150" class="label">Result column</text>
  <rect x="500" y="165" width="220" height="90" class="box-ok" rx="8"/>
  <text x="516" y="190" class="small">running_freight</text>
  <text x="516" y="212" class="small">32</text>
  <text x="516" y="232" class="small">43</text>
  <text x="516" y="252" class="small">108</text>

</svg>
