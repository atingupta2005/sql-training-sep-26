<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <style>
  .title { font: 700 18px Segoe UI, Arial, sans-serif; fill: #1f2937; }
  .label { font: 600 13px Segoe UI, Arial, sans-serif; fill: #111827; }
  .small { font: 12px Segoe UI, Arial, sans-serif; fill: #374151; }
  .muted { font: 11px Segoe UI, Arial, sans-serif; fill: #6b7280; }
  .box { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; }
  .box-hi { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.8; }
  .box-ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.8; }
  .box-warn { fill: #fef3c7; stroke: #d97706; stroke-width: 1.8; }
  .arrow { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
</style>

  <text x="24" y="32" class="title">RANK vs ROW_NUMBER (same prices, one tie)</text>
  <text x="24" y="54" class="muted">Prices: A=100, B=100, C=90, D=80  (ORDER BY price DESC)</text>

  <text x="24" y="92" class="label">RANK()</text>
  <rect x="24" y="104" width="340" height="200" class="box-warn" rx="8"/>
  <rect x="40" y="124" width="300" height="28" class="box-ok" rx="4"/>
  <text x="52" y="143" class="small">A 100 -> rank 1</text>
  <rect x="40" y="158" width="300" height="28" class="box-ok" rx="4"/>
  <text x="52" y="177" class="small">B 100 -> rank 1  (tie shares 1)</text>
  <rect x="40" y="192" width="300" height="28" class="box-hi" rx="4"/>
  <text x="52" y="211" class="small">C 90  -> rank 3  (2 is skipped)</text>
  <rect x="40" y="226" width="300" height="28" class="box" rx="4"/>
  <text x="52" y="245" class="small">D 80  -> rank 4</text>
  <text x="40" y="286" class="muted">Competition places (ties allowed)</text>

  <text x="396" y="92" class="label">ROW_NUMBER()</text>
  <rect x="396" y="104" width="340" height="200" class="box-hi" rx="8"/>
  <rect x="412" y="124" width="300" height="28" class="box-ok" rx="4"/>
  <text x="424" y="143" class="small">A 100 -> #1</text>
  <rect x="412" y="158" width="300" height="28" class="box" rx="4"/>
  <text x="424" y="177" class="small">B 100 -> #2  (no tie)</text>
  <rect x="412" y="192" width="300" height="28" class="box" rx="4"/>
  <text x="424" y="211" class="small">C 90  -> #3</text>
  <rect x="412" y="226" width="300" height="28" class="box" rx="4"/>
  <text x="424" y="245" class="small">D 80  -> #4</text>
  <text x="412" y="286" class="muted">Unique sequence inside the partition</text>

  <text x="24" y="350" class="small">Use RANK for "place". Use ROW_NUMBER for "1st row, 2nd row, ...".</text>

</svg>
