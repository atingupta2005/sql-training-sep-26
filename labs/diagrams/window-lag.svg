<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <style>
  .title { font: 700 18px Segoe UI, Arial, sans-serif; fill: #1f2937; }
  .label { font: 600 13px Segoe UI, Arial, sans-serif; fill: #111827; }
  .small { font: 12px Segoe UI, Arial, sans-serif; fill: #374151; }
  .muted { font: 11px Segoe UI, Arial, sans-serif; fill: #6b7280; }
  .box { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; }
  .box-hi { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.8; }
  .box-ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.8; }
  .box-warn { fill: #fef3c7; stroke: #d97706; stroke-width: 1.8; }
  .arrow { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
</style>

  <text x="24" y="32" class="title">LAG = look one row back inside the partition</text>
  <text x="24" y="54" class="muted">LAG(order_date) OVER (PARTITION BY customer_id ORDER BY order_date)</text>

  <rect x="40" y="90" width="680" height="150" class="box-hi" rx="10"/>
  <text x="56" y="118" class="label">Customer 1001 (one partition)</text>

  <rect x="70" y="140" width="150" height="60" class="box" rx="6"/>
  <text x="88" y="165" class="small">Order 1</text>
  <text x="88" y="185" class="small">2023-01-10</text>

  <rect x="280" y="140" width="150" height="60" class="box-ok" rx="6"/>
  <text x="298" y="165" class="small">Order 2</text>
  <text x="298" y="185" class="small">2023-01-25</text>

  <rect x="490" y="140" width="150" height="60" class="box" rx="6"/>
  <text x="508" y="165" class="small">Order 3</text>
  <text x="508" y="185" class="small">2023-02-02</text>

  <!-- arrows pointing back -->
  <path d="M280,170 H230" class="arrow"/>
  <text x="235" y="130" class="muted">LAG</text>
  <path d="M490,170 H440" class="arrow"/>
  <text x="445" y="130" class="muted">LAG</text>

  <text x="24" y="280" class="small">On Order 2, LAG returns 2023-01-10. On Order 1, LAG is NULL (no previous row).</text>

</svg>
