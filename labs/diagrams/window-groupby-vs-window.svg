<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <style>
  .title { font: 700 18px Segoe UI, Arial, sans-serif; fill: #1f2937; }
  .label { font: 600 13px Segoe UI, Arial, sans-serif; fill: #111827; }
  .small { font: 12px Segoe UI, Arial, sans-serif; fill: #374151; }
  .muted { font: 11px Segoe UI, Arial, sans-serif; fill: #6b7280; }
  .box { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; }
  .box-hi { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.8; }
  .box-ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.8; }
  .box-warn { fill: #fef3c7; stroke: #d97706; stroke-width: 1.8; }
  .arrow { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
</style>

  <text x="24" y="32" class="title">GROUP BY vs window function</text>
  <text x="24" y="54" class="muted">Same 3 orders for customer 1001 (freight 32, 11, 65)</text>

  <!-- Input -->
  <text x="24" y="90" class="label">Input rows</text>
  <rect x="24" y="100" width="160" height="28" class="box" rx="4"/>
  <text x="36" y="119" class="small">10248 | freight 32</text>
  <rect x="24" y="134" width="160" height="28" class="box" rx="4"/>
  <text x="36" y="153" class="small">10249 | freight 11</text>
  <rect x="24" y="168" width="160" height="28" class="box" rx="4"/>
  <text x="36" y="187" class="small">10250 | freight 65</text>

  <!-- Arrow to GROUP BY -->
  <path d="M200,150 H250" class="arrow"/>
  <!-- Arrow to WINDOW -->
  <path d="M200,170 H250" class="arrow"/>

  <!-- GROUP BY panel -->
  <rect x="260" y="80" width="210" height="140" class="box-warn" rx="8"/>
  <text x="278" y="108" class="label">GROUP BY</text>
  <text x="278" y="130" class="small">Collapse to 1 summary</text>
  <rect x="278" y="148" width="174" height="40" class="box" rx="4"/>
  <text x="290" y="173" class="small">1001 | total 108</text>
  <text x="278" y="208" class="muted">Detail rows disappear</text>

  <!-- WINDOW panel -->
  <rect x="500" y="80" width="236" height="200" class="box-ok" rx="8"/>
  <text x="518" y="108" class="label">WINDOW SUM(...)</text>
  <text x="518" y="130" class="small">Keep all rows + extra col</text>
  <rect x="518" y="148" width="200" height="28" class="box-hi" rx="4"/>
  <text x="528" y="167" class="small">10248 | 32 | run 32</text>
  <rect x="518" y="182" width="200" height="28" class="box-hi" rx="4"/>
  <text x="528" y="201" class="small">10249 | 11 | run 43</text>
  <rect x="518" y="216" width="200" height="28" class="box-hi" rx="4"/>
  <text x="528" y="235" class="small">10250 | 65 | run 108</text>
  <text x="518" y="268" class="muted">Same 3 rows, plus running total</text>

  <text x="24" y="330" class="label">Remember</text>
  <text x="24" y="356" class="small">GROUP BY answers: "What is the total?"</text>
  <text x="24" y="378" class="small">Window answers: "What is the total so far, on each row?"</text>

</svg>
